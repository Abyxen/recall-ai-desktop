name: Windows tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
